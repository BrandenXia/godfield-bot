[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godfield-bot"
version = "0.1.0"
description = "An observable, browser-controlled learning agent for God Field"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "filelock>=3.18,<4",
  "godfield==0.1.0",
  "platformdirs>=4.3,<5",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "structlog>=25,<26",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
simulation = [
  "godfield-sim==0.1.0",
  "numpy>=2.2,<3",
]
training = [
  "numpy>=2.2,<3",
  "torch>=2.6,<3",
]

[tool.uv.sources]
godfield = { git = "https://github.com/xu-shawn/pygodfield.git", rev = "679527115909cf9b516e6365b28c3221a33f3855" }
godfield-sim = { path = "native/godfield_sim" }

[project.scripts]
godfield-bot = "godfield_bot.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/godfield_bot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["godfield_bot"]
